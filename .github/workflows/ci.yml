name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: pip install numpy scipy pandas scikit-image pillow

      - name: Check Python syntax
        run: python -m compileall -q codes

      - name: Check shell scripts
        run: |
          for f in $(find codes -name "*.sh"); do
            bash -n "$f"
          done

      - name: Test image-quality metrics (SSIM, PSNR, SNR)
        run: python tests/test_image_metrics.py
